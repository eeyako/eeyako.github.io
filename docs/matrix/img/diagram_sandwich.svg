<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="300" fill="#1f2335"/>

  <!-- ================= Panel A : rotate about the world origin ================= -->
  <g>
    <text x="190" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#c0caf5">T alone</text>
    <text x="190" y="49" text-anchor="middle" font-size="12" fill="#7982a9">rotation about the world origin</text>

    <!-- world axes centered at (190,160) -->
    <line x1="70" y1="160" x2="330" y2="160" stroke="#414868" stroke-width="1.5"/>
    <line x1="190" y1="270" x2="190" y2="70" stroke="#414868" stroke-width="1.5"/>
    <text x="322" y="176" font-size="11" fill="#565f89">x</text>
    <text x="196" y="80" font-size="11" fill="#565f89">y</text>

    <!-- solid arc about the origin, with a direction arrowhead -->
    <path d="M260.5,141.1 A73,73 0 0 0 171.1,89.5" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
    <polygon points="205.2,88.6 213.8,86.3 212.2,94.2" fill="#7aa2f7"/>
    <!-- start point -->
    <circle cx="260.5" cy="141.1" r="6" fill="#1f2335" stroke="#7aa2f7" stroke-width="2"/>
    <!-- end point -->
    <circle cx="171.1" cy="89.5" r="6" fill="#7aa2f7"/>
    <text x="152" y="84" text-anchor="end" font-size="11" fill="#7aa2f7">after</text>
    <text x="272" y="137" font-size="11" fill="#7982a9">start</text>
  </g>

  <!-- ================= Panel B : rotate about the pivot (the sandwich) ================= -->
  <g>
    <text x="560" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#c0caf5">C&#8315;&#185; &#183; T &#183; C</text>
    <text x="560" y="49" text-anchor="middle" font-size="12" fill="#7982a9">rotation about pivot C</text>

    <!-- world axes centered at (560,160) -->
    <line x1="440" y1="160" x2="700" y2="160" stroke="#414868" stroke-width="1.5"/>
    <line x1="560" y1="270" x2="560" y2="70" stroke="#414868" stroke-width="1.5"/>
    <text x="692" y="176" font-size="11" fill="#565f89">x</text>
    <text x="566" y="80" font-size="11" fill="#565f89">y</text>

    <!-- pivot C at (650,190) -->
    <line x1="641" y1="190" x2="659" y2="190" stroke="#9ece6a" stroke-width="2"/>
    <line x1="650" y1="181" x2="650" y2="199" stroke="#9ece6a" stroke-width="2"/>
    <text x="662" y="204" font-size="11" fill="#9ece6a">C</text>

    <!-- solid arc about the pivot, with a direction arrowhead -->
    <path d="M638.5,125 A66,66 0 0 0 585,201.5" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
    <polygon points="586.9,170.7 585.4,161.9 593,164.2" fill="#7aa2f7"/>
    <!-- start point -->
    <circle cx="638.5" cy="125" r="6" fill="#1f2335" stroke="#7aa2f7" stroke-width="2"/>
    <!-- end point -->
    <circle cx="585" cy="201.5" r="6" fill="#7aa2f7"/>
    <text x="650" y="120" font-size="11" fill="#7982a9">start</text>
    <text x="566" y="210" text-anchor="end" font-size="11" fill="#7aa2f7">after</text>
  </g>

  <!-- divider + hint -->
  <line x1="390" y1="70" x2="390" y2="250" stroke="#292e42" stroke-width="1"/>
  <text x="390" y="292" text-anchor="middle" font-size="12" fill="#7982a9">
    same rotation matrix &#8212; only the coordinate frame it is expressed in changes
  </text>
</svg>
