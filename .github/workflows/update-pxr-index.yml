name: Update OpenUSD class index

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate pxr-index.json
        run: node scripts/update-pxr-index.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pxr-index.json
          if git diff --cached --quiet; then
            echo "Index is up to date."
            exit 0
          fi
          git commit -m "Update OpenUSD class index"
          git push
